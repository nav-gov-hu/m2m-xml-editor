# -----------------------------------------------------------------------------
# H2 database configuration (default)
# -----------------------------------------------------------------------------
# HU: Fajl alapu H2 adatbazis fejleszteshez/standalone hasznalathoz.
# EN: File-based H2 database for development/standalone usage.

nav.xsdparsertool.database.schema=PUBLIC
nav.xsdparsertool.database.encoding=UTF-8

spring.datasource.url=jdbc:h2:file:${app.data.dir}/database/schema-explorer;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/H2

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
