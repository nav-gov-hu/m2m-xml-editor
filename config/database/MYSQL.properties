# -----------------------------------------------------------------------------
# MySQL 5.7+ database configuration sample
# -----------------------------------------------------------------------------
# HU: UTF-8 hasznalathoz utf8mb4 karakterkeszlet ajanlott.
# EN: utf8mb4 is recommended for UTF-8 operation.
# HU: Lokalis MySQL 8 teszthez gyakran kell: allowPublicKeyRetrieval=true&useSSL=false
# EN: For local MySQL 8 tests, allowPublicKeyRetrieval=true&useSSL=false is often needed.

nav.xsdparsertool.database.schema=nav_xsd_parser_tool
nav.xsdparsertool.database.encoding=UTF-8

spring.datasource.url=jdbc:mysql://localhost:3306/nav_xsd_parser_tool?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Budapest&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=nav_user
spring.datasource.password=nav_password

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/MYSQL
