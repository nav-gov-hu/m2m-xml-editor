# -----------------------------------------------------------------------------
# Oracle 19c+ database configuration sample
# -----------------------------------------------------------------------------
# HU: Az adatbazis karakterkeszlete legyen AL32UTF8.
# HU: Az Oracle JDBC driver/profil bekapcsolasat lasd: docs/database-configuration.md
# EN: Use AL32UTF8 database character set.
# EN: See docs/database-configuration.md for enabling the Oracle JDBC driver/profile.

nav.xsdparsertool.database.schema=NAV_USER
nav.xsdparsertool.database.encoding=UTF-8

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=NAV_USER
spring.datasource.password=nav_password

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/ORACLE
