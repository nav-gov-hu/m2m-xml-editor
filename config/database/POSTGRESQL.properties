# -----------------------------------------------------------------------------
# PostgreSQL 14.x+ database configuration sample
# -----------------------------------------------------------------------------
# HU: Az adatbazis karakterkodolasat UTF8-ra allitsd.
# EN: Create/use the database with UTF8 encoding.

nav.xsdparsertool.database.schema=public
nav.xsdparsertool.database.encoding=UTF-8

spring.datasource.url=jdbc:postgresql://localhost:5432/nav_xsd_parser_tool?currentSchema=public
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=nav_user
spring.datasource.password=nav_password

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/POSTGRESQL
