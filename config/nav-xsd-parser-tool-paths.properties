# HU: Külső konfiguráció a webes felülethez. EN: External configuration for the web application.
# HU: Fejlesztői külső konfigurációs minta; a legacy path kulcsok nem szerepelnek benne. EN: Developer external configuration sample without legacy path keys.
# HU: A path típusú beállításoknál érvényes érték a létező vagy létrehozható helyi elérési út. EN: For path-like settings, a valid value is an existing or creatable local path.

# HU: Nincs beépített alapértelmezett érték; a sémafeloldást vezérli. EN: No built-in default value; controls schema resolution.
nav.xsdparsertool.paths.schema-dir=c:\\Temp\\ANYK_KIVALTAS\\repo\\web_repo\\xsd
nav.xsdparsertool.paths.common-xsd-dir=c:\\Temp\\ANYK_KIVALTAS\\repo\\common\\xsd

# HU: Ajánlott értékek: TRACE, DEBUG, INFO, WARN, ERROR. EN: Recommended values: TRACE, DEBUG, INFO, WARN, ERROR.
app.log.level=INFO
app.data.dir=C:/ProgramData/M2M-XML-EDITOR

logging.level.root=${app.log.level}
logging.file.name=${app.data.dir}/logs/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{sessionId}] [%X{requestId}] %logger - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{sessionId}] [%X{requestId}] %msg%n


# Webes munkamenet lejárati ideje. Példák: 30m, 2h.
# Lejárat után a frontend automatikusan a login oldalra irányít.
server.servlet.session.timeout=30m

# -----------------------------------------------------------------------------
# Kulso API kulcs / External API key
# -----------------------------------------------------------------------------
# HU: Elso koros egyszeru API authentikacio tavoli szerverek es Swagger UI tesztekhez.
# HU: Ha enabled=true es a kliens X-API-Key headerben ezt az erteket kuldi, teljes alkalmazasjogot kap.
# HU: A kulcsot csak ebben a kulso properties-ben vagy kornyezeti valtozoban tarold, forraskodba ne keruljon.
# EN: First-step simple API authentication for remote servers and Swagger UI tests.
nav.xsdparsertool.api-key.enabled=false
nav.xsdparsertool.api-key.header-name=X-API-Key
# nav.xsdparsertool.api-key.value=change-me-long-random-api-key
nav.xsdparsertool.api-key.value=${NAV_XSDPARSERTOOL_API_KEY:}
nav.xsdparsertool.api-key.principal-name=external-api-key-client



# XPath validátor konfiguráció
nav.xsdparsertool.xpath-validator.xsl-root-dir=c:\\Temp\\ANYK_KIVALTAS\\repo\\rule-xsl
nav.xsdparsertool.xpath-validator.rule-root-dir=c:\\Temp\\ANYK_KIVALTAS\\repo\\web_repo\\xpath
nav.xsdparsertool.xpath-validator.result-dir=c:\\Temp\\ANYK_KIVALTAS\\result
# HU: Pozitív egész másodperc; a szinkron REST várakozási időt befolyásolja. EN: Positive integer in seconds; affects synchronous REST waiting time.
nav.xsdparsertool.xpath-validator.sync-timeout-seconds=60
nav.xsdparsertool.xpath-validator.async-thread-count=4
nav.xsdparsertool.xpath-validator.async-queue-capacity=500
nav.xsdparsertool.xpath-validator.default-auto-refresh-seconds=10
nav.xsdparsertool.xpath-validator.default-page-size=10
nav.xsdparsertool.xpath-validator.fixed-xsl-name=full_check_core_public.xsl

logging.level.hu.gov.nav.xsdparsertool.web.xpath=INFO


# -----------------------------------------------------------------------------
# Adatbazis valasztas / Database selection
# -----------------------------------------------------------------------------
# HU: Csak itt kell atallitani, hogy melyik adatbazis-konfiguracios fajlt toltse be.
# EN: Change only this value to select which database configuration file is imported.
# Supported values: H2, POSTGRESQL, MYSQL, ORACLE
nav.xsdparsertool.database.type=MYSQL

# HU: A konkret datasource/Flyway beallitasok kulon fajlban vannak.
# HU: A telepitett external configban javasolt utvonal:
#     C:/ProgramData/M2M-XML-EDITOR/config/database/${nav.xsdparsertool.database.type}.properties
# EN: Concrete datasource/Flyway settings are stored in separate files.
# EN: Recommended installed external config path:
#     C:/ProgramData/M2M-XML-EDITOR/config/database/${nav.xsdparsertool.database.type}.properties
spring.config.import=optional:file:C:/ProgramData/M2M-XML-EDITOR/config/database/${nav.xsdparsertool.database.type}.properties

# HU: Fejleszteshez, ha a projekt melletti config/database mappat hasznalod, a fenti sort kommentezd ki,
#     es ezt kapcsold be:
# spring.config.import=optional:file:./config/database/${nav.xsdparsertool.database.type}.properties

# Szerveroldali XML import könyvtára. A tallózás és automatikus regisztráció csak ez alatt engedélyezett.
nav.xsdparsertool.xml-file.server-browser.enabled=true
nav.xsdparsertool.xml-file.server-import.root-dir=${app.data.dir}/data/import



# Header menüpontok láthatósága
# true = megjelenik, false = elrejtve
nav.xsdparsertool.ui.menu.home=true
nav.xsdparsertool.ui.menu.validate=false
nav.xsdparsertool.ui.menu.xml-files=true
nav.xsdparsertool.ui.menu.xpath-validator=false
nav.xsdparsertool.ui.menu.form=true
nav.xsdparsertool.ui.menu.admin=true


# Űrlap megjelenítő alapértelmezett módja
# classic = jelenlegi űrlapnézet, uimodel = új UI model alapú nézet
nav.xsdparsertool.form.renderer.default=uimodel

# Űrlapállomány szerkesztési zárolás
# Egy Űrlapállományt egyszerre csak egy felhasználó szerkeszthet.
nav.xsdparsertool.xml-file.lock.timeout-minutes=30
nav.xsdparsertool.xml-file.lock.renew-minutes=30
nav.xsdparsertool.xml-file.server-browser.auto-register-enabled=true
nav.xsdparsertool.xml-file.server-browser.auto-register-on-startup=true
nav.xsdparsertool.xml-file.server-browser.auto-register-interval-ms=30000

# HU: Desktop integráció és indítási splash. EN: Desktop integration and startup splash.
nav.xsdparsertool.desktop.enabled=true
nav.xsdparsertool.desktop.splash.enabled=true
nav.xsdparsertool.desktop.browser-open-enabled=true
nav.xsdparsertool.desktop.tray-enabled=true

# Sprint 11 - űrlap szintű XML index konfigurációs fájl.


# ----------------------------------------------------------------------------
# GitHub szervezeti sémafrissítő
# ----------------------------------------------------------------------------
# A modul a GitHub szervezet összes látható repository-jának tagjeit tölti le
# a nav.xsdparsertool.paths.schema-dir alá ilyen struktúrában:
#   <schema-dir>/<repo-nev>/<tag-nev>/
nav.xsdparsertool.github-schema-updater.enabled=true
nav.xsdparsertool.github-schema-updater.organization=nav-gov-hu-templates
nav.xsdparsertool.github-schema-updater.api-base-url=https://api.github.com
nav.xsdparsertool.github-schema-updater.download-mode=API_ZIPBALL
nav.xsdparsertool.github-schema-updater.archive-url-template=https://github.com/{owner}/{repo}/archive/refs/tags/{tag}.zip
nav.xsdparsertool.github-schema-updater.request-timeout=60s
nav.xsdparsertool.github-schema-updater.max-pages=50
nav.xsdparsertool.github-schema-updater.skip-existing-tag-directories=true
nav.xsdparsertool.github-schema-updater.rate-limit-enabled=true
nav.xsdparsertool.github-schema-updater.rate-limit-max-retries=5
nav.xsdparsertool.github-schema-updater.rate-limit-default-secondary-wait=60s
nav.xsdparsertool.github-schema-updater.rate-limit-max-wait=15m
nav.xsdparsertool.github-schema-updater.rate-limit-print-headers=false
# GitHub organizáció változásellenőrzési gyakoriság. 0s érték kikapcsolja.
nav.xsdparsertool.github-schema-updater.catalog-check-interval=15m
nav.xsdparsertool.github-schema-updater.catalog-check-initial-delay=1m
# Privát/internal repókhoz GitHub token szükséges. Biztonsági okból ezt csak lokális external configban töltsd ki.
# nav.xsdparsertool.github-schema-updater.token=
# Opcionális szűrés: üresen minden látható repót frissít.
# nav.xsdparsertool.github-schema-updater.repository-name-prefix=
# Opcionális explicit lista, ha nem minden repó kell:
# nav.xsdparsertool.github-schema-updater.repositories[0]=repo-name-1
# nav.xsdparsertool.github-schema-updater.repositories[1]=repo-name-2

#  Bizonylat státusz polling
# Automata státuszlekérdezés ki/be kapcsolása.
nav.m2m.status-poll.enabled=true
# Scheduler futási gyakoriság milliszekundumban.
nav.m2m.status-poll.fixed-delay-ms=60000
# Egy adott köztes státuszú beküldés következő lekérdezésének várakozási ideje.
nav.m2m.status-poll.interval=60s
# Meddig maradhat automata pollingban egy beküldés.
nav.m2m.status-poll.max-age=24h
# Egy scheduler futásban legfeljebb ennyi tételt kérdez le.
nav.m2m.status-poll.batch-size=50
# Sikertelen polling próbálkozások felső korlátja.
nav.m2m.status-poll.max-attempts=1440

# XPath/XSD drawer oldala: left vagy right
nav.xsdparsertool.form.validation-drawer.side=right
