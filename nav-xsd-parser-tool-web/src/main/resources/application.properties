# HU: Belső bootstrap konfiguráció. EN: Internal bootstrap configuration.
# HU: Csak az indításhoz szükséges minimális beállításokat tartalmazza. EN: Contains only the minimum settings required for application startup.

spring.application.name=nav-xsd-parser-tool-web
server.port=8080
# HU: MULTI_USER webes munkamenet alapértelmezett lejárati ideje. EN: Default MULTI_USER web session timeout.
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
app.version=@app.display.version@
app.asset.version=@build.asset.version@

# HU: Biztonsági üzemmód. Csak ebben az application.properties fájlban állítható.
# EN: Security mode. It is intentionally configured only in this application.properties file.
# Supported values: STANDALONE, MULTI_USER
nav.xsdparsertool.security.mode=MULTI_USER
nav.xsdparsertool.security.standalone.username=local-user


# HU: Egyszeru external API kulcsos autentikacio Swagger/tavoli API kliens teszteleshez.
# HU: A tenyleges kulcsot csak kulso properties-ben add meg, ne commitold.
# EN: Simple external API key authentication for Swagger/remote API client testing.
nav.xsdparsertool.api-key.enabled=false
nav.xsdparsertool.api-key.header-name=X-API-Key
nav.xsdparsertool.api-key.value=${NAV_XSDPARSERTOOL_API_KEY:}
nav.xsdparsertool.api-key.principal-name=external-api-key-client

# HU: Az adatbázis, Flyway és datasource beállításokat az external properties fájl tartalmazza.
# EN: Database, Flyway and datasource settings are intentionally kept in the external properties file.
# HU: Visszafelé kompatibilis külső konfiguráció-betöltés. A *_save fájlokat a Spring nem olvassa be.
# EN: Backward-compatible external configuration loading. *_save files are never imported.
spring.config.import=optional:file:./config/nav-xsd-parser-tool-paths.properties,optional:file:C:/ProgramData/M2M-XML-EDITOR/config/nav-xsd-parser-tool-paths.properties,optional:file:${LOCALAPPDATA:}/M2M-XML-EDITOR/config/nav-xsd-parser-tool-paths.properties

# HU: Szerveroldali XML import alapkönyvtára. EN: Default directory for server-side XML import.
nav.xsdparsertool.xml-file.server-import.root-dir=${app.data.dir:${nav.xsdparsertool.data-directory}}/data/import

# HU: MULTI_USER mod elso admin felhasznalojanak bootstrap beallitasa.
# HU: Csak akkor hoz letre admint, ha MULTI_USER mod aktiv, nincs meg felhasznalo, es enabled=true.
# EN: Bootstrap settings for the first admin user in MULTI_USER mode.
# EN: Admin is created only when MULTI_USER mode is active, there are no users yet, and enabled=true.
nav.xsdparsertool.security.bootstrap-admin.enabled=false
nav.xsdparsertool.security.bootstrap-admin.username=
nav.xsdparsertool.security.bootstrap-admin.password=
nav.xsdparsertool.security.bootstrap-admin.display-name=
nav.xsdparsertool.security.bootstrap-admin.email=

# HU: Sprint 7 streaming XSD validacio hibalimit. INFO rekord nem szamit hibakent.
nav.xsdparsertool.xsd-validation.max-errors=500
nav.xsdparsertool.xml-file.server-browser.auto-register-enabled=true
nav.xsdparsertool.xml-file.server-browser.auto-register-on-startup=true
nav.xsdparsertool.xml-file.server-browser.auto-register-interval-ms=30000


# HU: Sprint 10 nagy XML mód. EN: Sprint 10 large XML mode.
nav.xsdparsertool.xml-file.large-file.threshold=20 MB
nav.xsdparsertool.xml-file.large-file.disable-xml-tree=true
nav.xsdparsertool.xml-file.large-file.disable-xml-source=true

# HU: Desktop integráció és indítási splash. EN: Desktop integration and startup splash.
nav.xsdparsertool.desktop.enabled=true
nav.xsdparsertool.desktop.splash.enabled=true
nav.xsdparsertool.desktop.browser-open-enabled=true
nav.xsdparsertool.desktop.tray-enabled=true

# HU: Sprint 11 űrlap szintű XML index konfiguráció. EN: Sprint 11 form-level XML index configuration.

# HU: Sprint 11 v26 - GitHub szervezeti sémafrissítő modul API zipball alapértelmezéssel.
# EN: Sprint 11 v26 - GitHub organization based schema updater module.
nav.xsdparsertool.github-schema-updater.enabled=true
nav.xsdparsertool.github-schema-updater.organization=nav-gov-hu-templates
nav.xsdparsertool.github-schema-updater.api-base-url=https://api.github.com
nav.xsdparsertool.github-schema-updater.download-mode=API_ZIPBALL
nav.xsdparsertool.github-schema-updater.archive-url-template=https://github.com/{owner}/{repo}/archive/refs/tags/{tag}.zip
nav.xsdparsertool.github-schema-updater.request-timeout=60s
nav.xsdparsertool.github-schema-updater.max-pages=50
nav.xsdparsertool.github-schema-updater.skip-existing-tag-directories=true
nav.xsdparsertool.github-schema-updater.rate-limit-enabled=true
nav.xsdparsertool.github-schema-updater.rate-limit-max-retries=5
nav.xsdparsertool.github-schema-updater.rate-limit-default-secondary-wait=60s
nav.xsdparsertool.github-schema-updater.rate-limit-max-wait=15m
nav.xsdparsertool.github-schema-updater.rate-limit-print-headers=false
# GitHub organizáció változásellenőrzési gyakoriság. 0s érték kikapcsolja.
nav.xsdparsertool.github-schema-updater.catalog-check-interval=15m
nav.xsdparsertool.github-schema-updater.catalog-check-initial-delay=1m
# HU: Privát/internal repókhoz állíts be PAT tokent a külső configban. Ne commitolj tokent.
# nav.xsdparsertool.github-schema-updater.token=

# HU: Sprint 11 v27 - NAV M2M Submitter integráció.
# EN: Sprint 11 v27 - NAV M2M Submitter integration.
nav.m2m.mock-mode=true
nav.m2m.storage-directory=${app.data.dir:${nav.xsdparsertool.data-directory}}/data/attachments
nav.m2m.max-in-memory-bizonylat-api-bytes=524288000
nav.m2m.endpoints.common-base-url=https://m2m-dev.nav.gov.hu/rest-api/1.1
nav.m2m.endpoints.bizonylat-base-url=https://m2m-dev.nav.gov.hu/rest-api/1.0
nav.m2m.endpoints.token-path=/NavM2mCommon/tokenService/Token
nav.m2m.endpoints.nonce-path=/NavM2mCommon/userregistrationService/Nonce
nav.m2m.endpoints.activation-path=/NavM2mCommon/userregistrationService/Activation
nav.m2m.endpoints.file-upload-path=/NavM2mCommon/filestoreUploadService/File
nav.m2m.endpoints.file-status-path=/NavM2mCommon/filestoreDownloadService/File/{fileId}
nav.m2m.endpoints.bizonylat-path=/NavM2mBizonylat/bizonylatService/Bizonylat
nav.m2m.auth.client-id=
nav.m2m.auth.client-secret=
nav.m2m.auth.username=
nav.m2m.auth.password=
nav.m2m.signature.key-first-part=
nav.m2m.signature.nonce=
nav.m2m.signature.key-second-part=
nav.m2m.taxpayer.test-tax-number=11111111
nav.m2m.taxpayer.real-tax-number=1234567890
nav.m2m.polling.interval-ms=5000
nav.m2m.polling.max-attempts=20

# XPath/XSD drawer oldala: left vagy right (external property felulirhatja).
nav.xsdparsertool.form.validation-drawer.side=${NAV_XSDPARSERTOOL_VALIDATION_DRAWER_SIDE:right}

# M2M beküldési és csatolmány-biztonsági beállítások
nav.m2m.submission.allow-resubmit=true
nav.m2m.attachment.validity-duration=3d
nav.m2m.attachment.expiry-safety-margin=2h
